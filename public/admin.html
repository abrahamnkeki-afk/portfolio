<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Admin</title>
<link rel="stylesheet" href="/style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><main class="wrap post">
<a class="btn" href="/">← Back to site</a>
<h1>Write an article</h1>
<form id="f" novalidate>
<label>Admin token<input name="token" type="password" autocomplete="current-password" required></label>
<label>Title<input name="title" maxlength="120" required></label>
<label>Category<input name="category" maxlength="40" list="cats" placeholder="Technology, AI, Software, Geoscience, Learning, Entrepreneurship"></label>
<datalist id="cats"><option>Technology</option><option>AI</option><option>Software</option><option>Geoscience</option><option>Learning</option><option>Entrepreneurship</option></datalist>
<label>Date (optional)<input name="date" maxlength="40" placeholder="October 2026"></label>
<label>Short summary<textarea name="excerpt" maxlength="300" style="min-height:90px" required></textarea></label>
<label>Article text (leave a blank line between paragraphs)<textarea name="content" style="min-height:260px" required></textarea></label>
<button class="btn p" id="sb" type="submit">Publish article</button>
<div id="st" role="status" aria-live="polite"></div>
</form>
<h2 style="margin-top:56px;font-size:1.6rem">Published</h2>
<ul id="ls"></ul>
</main>
<script>
const $=s=>document.querySelector(s),f=$('#f'),E=f.elements,st=$('#st');
const say=(c,t)=>{st.className=c;st.textContent=t};
try{E.token.value=sessionStorage.getItem('t')||''}catch(e){}
const hd=()=>({Authorization:'Bearer '+E.token.value.trim(),'Content-Type':'application/json'});
async function list(){try{const L=await (await fetch('/api/articles')).json();
$('#ls').replaceChildren(...L.map(a=>{const li=document.createElement('li'),l=document.createElement('a'),b=document.createElement('button');
l.href='/writing/'+encodeURIComponent(a.slug);l.textContent=a.title;b.type='button';b.className='btn';b.textContent='Delete';b.onclick=()=>del(a.slug);li.append(l,b);return li}))}catch(e){}}
async function del(s){if(!confirm('Delete this article?'))return;
const r=await fetch('/api/articles/'+encodeURIComponent(s),{method:'DELETE',headers:hd()});say(r.ok?'ok':'bad',r.ok?'Deleted.':'Could not delete. Check your token.');list()}
f.addEventListener('submit',async e=>{e.preventDefault();const b=$('#sb');
if(!E.token.value.trim()||E.title.value.trim().length<3||E.excerpt.value.trim().length<10||!E.content.value.trim()){say('bad','Fill in the token, title, summary and article text.');return}
try{sessionStorage.setItem('t',E.token.value.trim())}catch(x){}
b.disabled=true;say('','');
try{const r=await fetch('/api/articles',{method:'POST',headers:hd(),body:JSON.stringify({title:E.title.value,category:E.category.value,date:E.date.value,excerpt:E.excerpt.value,content:E.content.value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean)})});
const j=await r.json().catch(()=>({}));
if(r.ok){say('ok','Published at /writing/'+j.slug+'. It can take up to a minute to appear everywhere.');E.title.value=E.excerpt.value=E.content.value='';list()}else say('bad',j.error||'Could not publish.')}
catch(x){say('bad','Network error. Try again.')}
b.disabled=false});
list();
</script></body></html>
